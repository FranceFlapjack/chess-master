<!doctype html><html><head><meta charset="utf-8"><title>Logo family</title>
<style>body{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#111;background:#fff;margin:0;padding:48px}
h1{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 32px}
.row{display:flex;gap:64px;align-items:flex-end;margin-bottom:56px}
.mark{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.mark small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#aaa}
.brand{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.brand svg{width:28px;height:28px}
.big svg{width:96px;height:96px}
.inv{background:#111;color:#fff;padding:24px}
</style></head><body>
<h1>Logo family · 2×2 grid, two tokens</h1>
<div class="row">
  <div class="mark"><small>Chess</small><div class="big"><img src="../assets/brand/logo-chess.svg" width="120" height="120"></div></div>
  <div class="mark"><small>Go (same 2×2 footprint, stones on points)</small><div class="big"><img src="../assets/brand/logo-go.svg" width="120" height="120"></div></div>
</div>
<div class="row">
  <div class="brand"><img src="../assets/brand/logo-chess.svg" width="36" height="36"> Chess Learn</div>
  <div class="brand"><img src="../assets/brand/logo-go.svg" width="36" height="36"> Go Learn</div>
</div>
<div class="row"><div class="inv brand" style="filter:invert(1)"><img src="../assets/brand/logo-chess.svg" width="36" height="36"> Chess Learn</div></div>
</body></html>
