<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/chessboard.css">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/markers/markers.css">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/promotion-dialog/promotion-dialog.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">Chess Learn<small>lessons from real games</small></a>
    <nav class="curriculum" id="curriculum" aria-label="Curriculum"></nav>
    <footer class="sidebar-footer">
      <div id="activity"></div>
      <div class="sidebar-tools">
        <button id="mute" class="icon-btn" aria-pressed="false" title="Sound"></button>
        <span>
          <button id="export" class="btn quiet" title="Download your progress as a file">Export</button>
          <label class="btn quiet" title="Load a progress file">Import<input id="import" type="file" accept="application/json" class="sr-only"></label>
        </span>
      </div>
    </footer>
  </aside>
  <div>
    <div class="topbar"><button id="menu" class="icon-btn" aria-label="Menu"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button><a class="brand" href="#/">Chess Learn</a></div>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
